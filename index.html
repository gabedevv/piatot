
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabe Oms ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: "Courier New", monospace;
}

/* INTRO */

#intro {
    position: fixed;
    inset: 0;
    background: #080808;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    z-index: 10;
    padding: 20px;
    transition: opacity 1s ease;
}

#intro h1 {
    font-size: 25px;
    font-weight: normal;
    margin-bottom: 15px;
}

#intro p {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    gap: 15px;
}

button {
    padding: 12px 28px;
    border: 1px solid #777;
    background: transparent;
    color: white;
    font-family: inherit;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: white;
    color: black;
}

/* LETTER PAPER */

.paper {
    position: relative;
    width: min(92vw, 480px);
    max-height: 88vh;
    min-height: 400px;
    background: #f5f5f5;
    padding: 30px 25px 35px 40px;
    transform: rotate(-2deg);
    box-shadow: 0 0 35px #555;
    opacity: 0;
    overflow-y: auto;
    transition: opacity 1.5s ease;
    scrollbar-width: thin;
}

.holes {
    position: absolute;
    left: 10px;
    top: 10px;
    bottom: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.holes span {
    width: 13px;
    height: 13px;
    background: #080808;
    border-radius: 50%;
}

/* PICTURES */

.pictures {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
}

.pictures img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border: 5px solid white;
    box-shadow: 0 2px 8px #aaa;
    border-radius: 2px;
}

.picture-caption {
    text-align: center;
    font-size: 10px;
    color: #888;
    margin-top: 10px;
    margin-bottom: 22px;
    letter-spacing: 1px;
}

/* MESSAGE */

#message {
    font-size: 12px;
    line-height: 1.9;
    color: #333;
    white-space: pre-wrap;
    text-align: left;
}

.signature {
    text-align: right;
    margin-top: 20px;
    font-size: 23px;
    color: #777;
}

#noMessage {
    display: none;
    color: #aaa;
    text-align: center;
    font-size: 14px;
    line-height: 2;
    margin-top: 30px;
}

/* MOBILE */

@media (max-width: 400px) {
    .paper {
        padding: 25px 18px 30px 32px;
    }

    .pictures img {
        height: 155px;
    }

    #message {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="bgMusic" preload="auto" loop>
    <source src="coming-up-roses.mp3" type="audio/mpeg">
</audio>

<!-- INTRO -->

<div id="intro">

    <h1>for you again my babyy ♡</h1>
    <p>Letter sa Chinabank babyy!</p>

    <div class="buttons">
        <button onclick="openLetter()">Yes </button>
        <button onclick="dontOpen()">Don't Open</button>
    </div>

    <div id="noMessage">
        k, my babyy.<br>
        gebot will not pugos if ayaw mo bb. ♡
        <br><br>
        <button onclick="goBack()">Go Back</button>
    </div>

</div>

<!-- LETTER -->

<div class="paper" id="paper">

    <div class="holes">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span>
    </div>

    

    <div class="pictures">

        <img src="IMG_6492.jpeg" alt="Our first picture">

        <img src="IMG_6494.jpeg" alt="Our second picture">

    </div>

    <div class="picture-caption">
        US, TOGETHER AFTER SIMBA ♡
    </div>

    <!-- ROMANTIC MESSAGE -->

    <div id="message"></div>

    <div class="signature">♡</div>

</div>

<script>

const text = `Babyy, ikaw ra ahong e marry puhon babyy and maka uban sa ahong future.

I want us to build a beautiful life babyy, have a family, life comfortably and happily.

Ato e reach atong dreams and goals sa life together babyy, and naa rako nimo always babyy ko.

I lovee you very very much babyy!`;

let index = 0;

function typeWriter() {

    if (index < text.length) {

        document.getElementById("message").textContent +=
            text.charAt(index);

        index++;

        setTimeout(typeWriter, 55);
    }
}

function openLetter() {

    const intro = document.getElementById("intro");
    const paper = document.getElementById("paper");
    const music = document.getElementById("bgMusic");

    const CHORUS_TIMESTAMP = 60;

    music.volume = 0.3;

    function startMusicAtChorus() {

        const target = Math.min(
            CHORUS_TIMESTAMP,
            Math.max(0, music.duration - 0.5)
        );

        music.currentTime = target;

        const playPromise = music.play();

        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.error("Music could not play:", error);
                alert("Make sure coming-up-roses.mp3 is in the same folder as this HTML file.");
            });
        }
    }

    if (music.readyState >= 1) {
        startMusicAtChorus();
    } else {
        music.addEventListener(
            "loadedmetadata",
            startMusicAtChorus,
            { once: true }
        );

        music.load();
    }

    intro.style.opacity = "0";

    setTimeout(() => {

        intro.style.display = "none";

        paper.style.opacity = "1";

        setTimeout(typeWriter, 1000);

    }, 1000);

}

function dontOpen() {

    document.getElementById("noMessage").style.display = "block";

    document.querySelector(".buttons").style.display = "none";

}

function goBack() {

    document.getElementById("noMessage").style.display = "none";

    document.querySelector(".buttons").style.display = "flex";

}

</script>

</body>
</html>
